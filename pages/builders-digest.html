<!DOCTYPE html>
<html lang="en">
  <!-- ═══════════════════════════════════════════════

═══════════════════════════════════════════════ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO Meta ── -->
    <title>
      Blog | Digital Marketing, Branding & Tech Insights | Revit Systems
    </title>
    <meta
      name="description"
      content="Expert insights on digital marketing, branding, software development, and business growth in Nigeria. Read the Revit Systems blog — updated regularly for Nigerian business leaders."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Revit Systems" />

    <!-- ── Canonical ── -->
    <link
      rel="canonical"
      href="https://www.revitsystems.org/pages/builders-digest.html"
    />

    <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp previews) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Revit Systems" />
    <meta
      property="og:title"
      content="Blog | Digital Marketing, Branding & Tech Insights | Revit Systems Abuja"
    />
    <meta
      property="og:description"
      content="Expert insights on digital marketing, branding, software development, and business growth in Nigeria. Read the Revit Systems blog."
    />
    <meta
      property="og:url"
      content="https://www.revitsystems.org/pages/builders-digest.html"
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dmvltush8/image/upload/v1760973008/without_bg_black_font_pjd8q9.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@revitsystems" />
    <meta
      name="twitter:title"
      content="Blog | Digital Marketing, Branding & Tech Insights | Revit Systems"
    />
    <meta
      name="twitter:description"
      content="Expert insights on digital marketing, branding, software development, and business growth in Nigeria."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/dmvltush8/image/upload/v1760973008/without_bg_black_font_pjd8q9.png"
    />

    <!-- ── Blog / CollectionPage Schema (GEO) ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Revit Systems Blog",
        "description": "Expert insights on digital marketing, branding, software development, and business consulting for Nigerian businesses and entrepreneurs.",
        "url": "https://www.revitsystems.org/pages/builders-digest.html",
        "publisher": {
          "@type": "Organization",
          "name": "Revit Systems",
          "url": "https://www.revitsystems.org",
          "logo": {
            "@type": "ImageObject",
            "url": "https://res.cloudinary.com/dmvltush8/image/upload/v1760973008/without_bg_black_font_pjd8q9.png"
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Abuja",
            "addressRegion": "FCT",
            "addressCountry": "NG"
          }
        },
        "inLanguage": "en-NG",
        "about": [
          { "@type": "Thing", "name": "Digital Marketing" },
          { "@type": "Thing", "name": "Branding" },
          { "@type": "Thing", "name": "Software Development" },
          { "@type": "Thing", "name": "Business Consulting" },
          { "@type": "Thing", "name": "Nigerian Business" }
        ]
      }
    </script>

    <!-- ── BreadcrumbList Schema (GEO) ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://www.revitsystems.org/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Builders Digest",
            "item": "https://www.revitsystems.org/pages/builders-digest.html"
          }
        ]
      }
    </script>

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- ── Stylesheets ── -->
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/root-variables.css" />
    <link rel="stylesheet" href="../assets/css/blog.css" />
    <link rel="stylesheet" href="../component/header-and-footer.css" />

    <!-- ── Favicon ── -->
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/dmvltush8/image/upload/v1760973008/favicon_qdd9zl.png"
    />
  </head>

  <body>
    <div class="revit-container">
      <!-- ==========================================
           HEADER — untouched from original
           ========================================== -->
      <div id="header-container"></div>
      <!-- ==========================================
           BLOG SECTION — redesigned
           ========================================== -->
      <div class="blog-section">
        <!-- Header band with title, search, and filters -->
        <div class="blog-header-band">
          <div class="blog-header-inner">
            <!-- Breadcrumb -->
            <nav class="rv-breadcrumb">
              <a href="../index.html">Home</a>
              <i class="fas fa-chevron-right"></i>
              <span>Builders Digest</span>
            </nav>

            <!-- Title + Search -->
            <div class="blog-title-row">
              <div class="blog-title-group">
                <h1>Ideas that move<br /><em>brands forward</em></h1>
                <p>
                  Insights, strategies, and stories for businesses ready to
                  grow.
                </p>
              </div>

              <div class="blog-search-wrap">
                <input
                  type="text"
                  id="blogSearchInput"
                  placeholder="Search articles..."
                  autocomplete="off"
                />
                <button id="blogSearchBtn" aria-label="Search">
                  <i class="fas fa-search"></i>
                </button>
                <div class="search-results-label" id="searchResultsLabel"></div>
              </div>
            </div>

            <!-- Category filters -->
            <div class="blog-filter-row">
              <span class="filter-label">Browse</span>
              <button class="blog-filter-btn active" data-category="All">
                All posts
              </button>
              <button
                class="blog-filter-btn"
                data-category="Software Development"
              >
                Software
              </button>
              <button class="blog-filter-btn" data-category="Digital Marketing">
                Marketing
              </button>
              <button
                class="blog-filter-btn"
                data-category="Business Education"
              >
                Business
              </button>
              <button class="blog-filter-btn" data-category="Branding">
                Branding
              </button>
            </div>
          </div>
        </div>

        <!-- Posts area -->
        <div class="blog-posts-area">
          <!-- Featured post slot — populated by JS -->
          <div id="featuredPostSlot"></div>

          <!-- Grid label -->
          <div class="blog-grid-label" id="gridLabel">Latest articles</div>

          <!-- Cards grid -->
          <div class="blog-cards-grid" id="postsContainer">
            <!-- Skeleton placeholders shown on first load -->
            <div class="rv-skeleton-card">
              <div class="rv-skeleton rv-skeleton-img"></div>
              <div class="rv-skeleton-body">
                <div class="rv-skeleton rv-skeleton-tag"></div>
                <div class="rv-skeleton rv-skeleton-title"></div>
                <div class="rv-skeleton rv-skeleton-title-2"></div>
                <div class="rv-skeleton rv-skeleton-line"></div>
                <div class="rv-skeleton rv-skeleton-line-short"></div>
              </div>
            </div>
            <div class="rv-skeleton-card">
              <div class="rv-skeleton rv-skeleton-img"></div>
              <div class="rv-skeleton-body">
                <div class="rv-skeleton rv-skeleton-tag"></div>
                <div class="rv-skeleton rv-skeleton-title"></div>
                <div class="rv-skeleton rv-skeleton-title-2"></div>
                <div class="rv-skeleton rv-skeleton-line"></div>
                <div class="rv-skeleton rv-skeleton-line-short"></div>
              </div>
            </div>
            <div class="rv-skeleton-card">
              <div class="rv-skeleton rv-skeleton-img"></div>
              <div class="rv-skeleton-body">
                <div class="rv-skeleton rv-skeleton-tag"></div>
                <div class="rv-skeleton rv-skeleton-title"></div>
                <div class="rv-skeleton rv-skeleton-title-2"></div>
                <div class="rv-skeleton rv-skeleton-line"></div>
                <div class="rv-skeleton rv-skeleton-line-short"></div>
              </div>
            </div>
          </div>

          <!-- Load more -->
          <div class="blog-load-more-wrap">
            <button class="blog-load-more-btn" id="loadMoreBtn">
              <i class="fas fa-arrow-down"></i>
              Load more articles
            </button>
          </div>
        </div>
      </div>
      <!-- End blog section -->

      <!-- ==========================================
           FOOTER — untouched from original
           ========================================== -->
      <div id="footer"></div>
      <script defer src="/assets/js/footer.js"></script>
      <script defer src="/assets/js/headerMenu.js"></script>
      <script defer src="/assets/js/header.js"></script>
      <script defer src="../assets/js/config.js"></script>
      <script defer src="../assets/js/script.js"></script>
      <script defer src="../assets/js/blog.js"></script>
      <!-- ── Scripts ── -->

      <!-- Loader -->
      <div class="loader-holder" id="loader">
        <div class="loader"></div>
      </div>
    </div>
  </body>
</html>
