<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Revit Systems</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --primary-light: #818cf8;
        --error: #ef4444;
        --success: #10b981;
        --warning: #f59e0b;
        --dark: #1e293b;
        --gray: #64748b;
        --light-gray: #f1f5f9;
        --white: #ffffff;
        --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
        --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      /* Animated background shapes */
      body::before,
      body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        opacity: 0.1;
        animation: float 20s infinite ease-in-out;
      }

      body::before {
        width: 400px;
        height: 400px;
        background: white;
        top: -200px;
        right: -100px;
        animation-delay: 0s;
      }

      body::after {
        width: 300px;
        height: 300px;
        background: white;
        bottom: -150px;
        left: -100px;
        animation-delay: -10s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(30px, -30px) scale(1.1);
        }
        66% {
          transform: translate(-20px, 20px) scale(0.9);
        }
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 3rem;
        border-radius: 24px;
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 420px;
        text-align: center;
        position: relative;
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        width: 64px;
        height: 64px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.3);
      }

      .logo svg {
        width: 32px;
        height: 32px;
        fill: white;
      }

      h2 {
        color: var(--dark);
        margin-bottom: 0.5rem;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .subtitle {
        color: var(--gray);
        margin-bottom: 2rem;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .form-group {
        text-align: left;
        margin-bottom: 1.5rem;
        position: relative;
      }

      .input-wrapper {
        position: relative;
      }

      input {
        width: 100%;
        padding: 16px 48px 16px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        background: var(--white);
        transition: all 0.3s ease;
        outline: none;
      }

      input:hover {
        border-color: #cbd5e1;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }

      input::placeholder {
        color: #94a3b8;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--dark);
        font-size: 0.9rem;
        transition: color 0.3s ease;
      }

      .form-group:focus-within label {
        color: var(--primary);
      }

      .password-container {
        position: relative;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      input {
        width: 100%;
        padding: 16px 80px 16px 16px; /* Increased right padding to make room for button */
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        background: var(--white);
        transition: all 0.3s ease;
        outline: none;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--gray);
        font-size: 0.85rem;
        cursor: pointer;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        transition: all 0.2s ease;
        width: auto;
        margin: 0;
        pointer-events: auto; /* Ensure button is clickable */
        z-index: 2; /* Keep button above input */
      }

      .toggle-password:hover {
        color: var(--primary);
        background: var(--light-gray);
      }

      /* Password strength indicator */
      .password-strength {
        margin-top: 0.5rem;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        overflow: hidden;
        display: none;
      }

      .password-strength.show {
        display: block;
      }

      .password-strength-bar {
        height: 100%;
        width: 0;
        transition: all 0.3s ease;
        border-radius: 2px;
      }

      .password-strength-bar.weak {
        width: 33%;
        background: var(--error);
      }

      .password-strength-bar.medium {
        width: 66%;
        background: var(--warning);
      }

      .password-strength-bar.strong {
        width: 100%;
        background: var(--success);
      }

      .password-strength-text {
        font-size: 0.75rem;
        margin-top: 0.25rem;
        color: var(--gray);
        display: none;
      }

      .password-strength-text.show {
        display: block;
      }

      button[type="submit"] {
        width: 100%;
        padding: 16px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 0.5rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
        position: relative;
        overflow: hidden;
      }

      button[type="submit"]:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.3);
      }

      button[type="submit"]:active:not(:disabled) {
        transform: translateY(0);
      }

      button[type="submit"]:disabled {
        background: #cbd5e1;
        cursor: not-allowed;
        box-shadow: none;
      }

      button[type="submit"]::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      button[type="submit"]:active::after {
        width: 300px;
        height: 300px;
      }

      #message {
        margin-top: 1.5rem;
        font-size: 0.95rem;
        padding: 16px;
        border-radius: 12px;
        display: none;
        animation: shake 0.5s ease-in-out;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      #message.error {
        background: #fef2f2;
        color: var(--error);
        border: 1px solid #fecaca;
        display: block;
      }

      #message.success {
        background: #f0fdf4;
        color: var(--success);
        border: 1px solid #bbf7d0;
        display: block;
      }

      .back-link {
        margin-top: 1.5rem;
        font-size: 0.9rem;
      }

      .back-link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .back-link a:hover {
        color: var(--primary-dark);
        text-decoration: underline;
      }

      .lock-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      /* Loading spinner */
      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
        margin-right: 8px;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Responsive */
      @media (max-width: 480px) {
        .container {
          padding: 2rem;
          border-radius: 20px;
        }

        h2 {
          font-size: 1.5rem;
        }
      }

      /* Invalid state */
      input.invalid {
        border-color: var(--error);
        background: #fef2f2;
      }

      input.valid {
        border-color: var(--success);
        background: #f0fdf4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
          />
        </svg>
      </div>

      <h2>Reset Password</h2>
      <p class="subtitle" id="instruction">
        Create a new secure password for your account
      </p>

      <form id="reset-password-form">
        <div class="form-group password-container">
          <label for="new-password">New Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="new-password"
              placeholder="Enter your new password"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="new-password"
              aria-label="Toggle password visibility"
            >
              SHOW
            </button>
          </div>
          <div class="password-strength" id="strength-bar">
            <div class="password-strength-bar" id="strength-bar-fill"></div>
          </div>
          <div class="password-strength-text" id="strength-text"></div>
        </div>

        <div class="form-group password-container">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm your new password"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              data-target="confirm-password"
              aria-label="Toggle password visibility"
            >
              SHOW
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn">Update Password</button>
      </form>

      <div id="message"></div>

      <div class="back-link">
        <a href="/login/login.html">← Back to login</a>
      </div>
    </div>

    <script src="reset-password.js"></script>
  </body>
</html>
